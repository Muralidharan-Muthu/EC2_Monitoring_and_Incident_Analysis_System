version: "3.9"

# Optional Docker Compose for local development.
# Production database: Supabase PostgreSQL (external, not in Docker).
#
# Usage:
#   docker compose up -d db     # Start local PostgreSQL only
#   docker compose up -d        # Start everything locally
#
# NOTE: When using Supabase in production, only run the backend and
# frontend services in Docker — NOT the local PostgreSQL service.

services:
  # ---- Local PostgreSQL (for development only) ----
  db:
    image: postgres:16-alpine
    container_name: ec2monitor-db
    environment:
      POSTGRES_USER: ec2monitor
      POSTGRES_PASSWORD: local_dev_password_only
      POSTGRES_DB: ec2monitor
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ec2monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- FastAPI Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ec2monitor-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ec2monitor:local_dev_password_only@db:5432/ec2monitor
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---- React Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ec2monitor-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  db_data:
